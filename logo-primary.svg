<svg viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A365D"/>
      <stop offset="100%" stop-color="#2C5282"/>
    </linearGradient>
  </defs>

  <!-- ICON: Goniometer arc mark -->
  <g transform="translate(20,20)">
    <!-- outer arc (protractor/goniometer body) -->
    <path d="M 20 130 A 110 110 0 0 1 130 20"
          fill="none" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- tick marks along the arc, like a real goniometer -->
    <g stroke="#1A365D" stroke-width="3" stroke-linecap="round">
      <line x1="24" y1="105" x2="34" y2="103"/>
      <line x1="32" y1="80" x2="43" y2="80"/>
      <line x1="48" y1="55" x2="57" y2="61"/>
      <line x1="70" y1="35" x2="75" y2="45"/>
      <line x1="98" y1="24" x2="100" y2="35"/>
    </g>

    <!-- pivot point (the joint) -->
    <circle cx="20" cy="130" r="9" fill="#1A365D"/>

    <!-- fixed arm (baseline limb segment) -->
    <line x1="20" y1="130" x2="130" y2="130" stroke="#1A365D" stroke-width="9" stroke-linecap="round"/>

    <!-- moving arm sweeping upward through the arc: recovery / progress -->
    <line x1="20" y1="130" x2="95" y2="45" stroke="#38A169" stroke-width="9" stroke-linecap="round"/>

    <!-- progress tip -->
    <circle cx="95" cy="45" r="7" fill="#38A169"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(180,70)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-weight="800" font-size="34" fill="#1A365D" letter-spacing="1">HI-TECH</text>
    <text x="0" y="34" font-family="Arial, sans-serif" font-weight="400" font-size="24" fill="#2C5282" letter-spacing="3">PHYSIOTHERAPY</text>
    <rect x="0" y="46" width="70" height="4" fill="#38A169"/>
    <text x="0" y="70" font-family="Arial, sans-serif" font-weight="400" font-size="13" fill="#4A5568" letter-spacing="0.5">DEHRADUN &#183; PAIN RELIEF WITHOUT SURGERY</text>
  </g>
</svg>
